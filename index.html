<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kart Racer</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="hud">
    <div id="topleft">
      <div id="lap">LAP 1/2</div>
      <div id="time">00:00.000</div>
    </div>
    <canvas id="minimap" width="220" height="220"></canvas>
    <canvas id="radar" width="360" height="360"></canvas>
    <div id="center"></div>
    <div id="wrongway">WRONG WAY!</div>
    <div id="bottomright">
      <div id="speed">0 <span>km/h</span></div>
      <div id="pos">8<sup>th</sup></div>
    </div>
    <div id="hint">W/↑ gas · S/↓ brake · A/D steer · hold SPACE while turning to drift (release for boost) · R restart</div>
    <div id="results" class="hidden">
      <h1>RESULTS</h1>
      <ol id="results-list"></ol>
      <p>Press <b>R</b> or <b>Enter</b> to race again</p>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
